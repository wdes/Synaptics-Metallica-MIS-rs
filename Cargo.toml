[package]
# crates.io requires lowercase ASCII for the package name; the
# project's display name is "Synaptics-Metallica-MIS-rs" — see README.
name = "synaptics-metallica-mis-rs"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
authors = ["William Desportes <williamdes@wdes.fr>"]
license = "MPL-2.0"
description = "Synaptics-Metallica-MIS-rs — pure-Rust userspace driver for the Synaptics/Validity Metallica MIS (06cb:009a) fingerprint sensor found on the ThinkPad P70 and other Lenovo laptops."
repository = "https://github.com/wdes/Synaptics-Metallica-MIS-rs"
readme = "README.md"
keywords = ["fingerprint", "synaptics", "validity", "thinkpad", "usb"]
categories = ["hardware-support", "command-line-utilities"]

[lib]
# Library import path stays `think_touch` for source compatibility —
# all internal crates and tests `use think_touch::…`.
name = "think_touch"
path = "src/lib.rs"

[[bin]]
# CLI command name stays `synaptics-metallica-mis` for ergonomics — short, fast
# to type, and stable across the project's prior history.
name = "synaptics-metallica-mis"
path = "src/main.rs"

[dependencies]
nusb = "0.2"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
subtle = "2"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "arithmetic"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
